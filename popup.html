<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aetherbook Themes</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">AETHERBOOK</p>
        <h1>Make Facebook yours</h1>
        <p class="description">Change the look while keeping Facebook's features.</p>
      </header>

      <label class="toggle-row" for="enabled">
        <span>
          <strong>Theme Facebook</strong>
          <small>Only changes how the site looks to you.</small>
        </span>
        <input id="enabled" type="checkbox">
      </label>

      <label class="toggle-row wallpaper-row" for="nebula-enabled">
        <span>
          <strong>Nebula wallpaper</strong>
          <small>Animated background behind the page.</small>
        </span>
        <input id="nebula-enabled" type="checkbox">
      </label>
      <label class="color-field wallpaper-color" for="nebula-color">
        <span>Wallpaper color</span>
        <input id="nebula-color" type="color" value="#7c3aed">
      </label>

      <label class="field" for="preset">
        <span class="field-title">Theme</span>
        <select id="preset">
          <option value="classic">Classic</option>
          <option value="twitter">Twitter-inspired</option>
          <option value="futuristic">Futuristic (Neon Colors)</option>
          <option value="midnight">Midnight (Dark Mode)</option>
          <option value="lavender">Lavender</option>
          <option value="forest">Forest</option>
          <option value="custom">Custom</option>
        </select>
      </label>

      <section id="custom-colors" aria-label="Custom palette colors">
        <label class="color-field" for="page">
          <span>Page</span>
          <input id="page" type="color">
        </label>
        <label class="color-field" for="surface">
          <span>Cards</span>
          <input id="surface" type="color">
        </label>
        <label class="color-field" for="text">
          <span>Text</span>
          <input id="text" type="color">
        </label>
        <label class="color-field" for="accent">
          <span>Accent</span>
          <input id="accent" type="color">
        </label>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
      <footer>Theme settings sync with your browser profile.</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
